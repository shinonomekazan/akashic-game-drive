<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ニコ生ゲーム置き場（仮）</title>
		<link rel="stylesheet" href="/css/styles.css" />
		<script src="/js/manage.bundle.js"></script>
	</head>
	<body>
		<div id="app-root">
			<div class="container-fluid d-none" id="usersContent">
				<div class="row">
					<main>
						<section class="container">
							<div class="d-flex justify-content-center mt-2 flex-column align-items-center">
								<h2>ニコ生ゲーム置き場（仮）</h2>
								<h2>管理ツール – ユーザー管理</h2>
							</div>
							<div class="d-flex flex-column align-items-end mb-2">
								<div
									id="searchUserId"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label for="userId" class="me-3 w-50">ID</label>
									<input id type="text" class="form-control" placeholder="ユーザー ID" />
								</div>
								<div
									id="searchUserName"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label for="userName" class="me-3 w-50">ユーザー名</label>
									<input type="text" class="form-control" placeholder="ユーザー名" />
								</div>
								<button id="filterUser" class="btn btn-primary">フィルタ</button>
							</div>
							<table id="usersTableList" class="table table-striped table-hover">
								<thead>
									<tr>
										<th>ユーザー ID</th>
										<th>ユーザー名</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
							<nav class="d-flex justify-content-center">
								<button id="readMoreBtn" class="btn btn-secondary">もっと見る</button>
							</nav>
						</section>
					</main>
				</div>
			</div>
		</div>
		<div id="toast" aria-live="polite"></div>
		<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-fullscreen">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="detailModalLabel">詳細</h5>
					</div>
					<div class="modal-body">
						<div class="d-flex justify-content-end me-3" id="actionBtn">
							<button type="button" class="btn me-3" id="editBtn"></button>
							<button type="button" class="btn btn-danger" id="deleteBtn">削除</button>
						</div>
						<div class="d-flex justify-content-center mb-4" id="avatarIcon"></div>
						<form id="detailForm" class="w-25 mx-auto mb-3">
							<div class="mb-3">
								<label for="uid" class="form-label">ID</label>
								<input type="text" class="form-control" name="uid" id="uid" readonly />
							</div>
							<div class="mb-3">
								<label for="name" class="form-label">名前</label>
								<input type="text" class="form-control" name="name" id="name" readonly />
							</div>
							<div class="mb-3">
								<label for="createdAt" class="form-label">作成日時</label>
								<input type="text" class="form-control" name="createdAt" id="createdAt" readonly />
							</div>
							<div class="mb-3">
								<label for="updatedAt" class="form-label">更新日時</label>
								<input type="text" class="form-control" name="updatedAt" id="updatedAt" readonly />
							</div>
						</form>
						<div class="my-4">
							<h3>投稿コンテンツ</h3>
							<table id="contentsTableList" class="table table-striped">
								<thead>
									<tr class="table-dark">
										<th>ID</th>
										<th>表題</th>
										<th>描写</th>
										<th>態</th>
										<th>警告</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
						<div class="my-4">
							<h3>送信フィードバック</h3>
							<table id="myFeedbacksTableList" class="table table-striped">
								<thead>
									<tr class="table-dark">
										<th>ID</th>
										<th>受信者ID</th>
										<th>表題</th>
										<th>ディテール</th>
										<th>内コンテンツID</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
						<div class="my-4">
							<h3>受信フィードバック</h3>
							<table id="feedbacksTableList" class="table table-striped">
								<thead>
									<tr class="table-dark">
										<th>ID</th>
										<th>送信者ID</th>
										<th>表題</th>
										<th>ディテール</th>
										<th>内コンテンツID</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
					</div>
				</div>
			</div>
		</div>
		<script>
			const tool = new manage.Manage();
			document.addEventListener("DOMContentLoaded", () => {
				tool.usersPage();
			});
		</script>
	</body>
</html>
