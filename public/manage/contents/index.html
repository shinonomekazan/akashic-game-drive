<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ニコ生ゲーム置き場（仮）</title>
		<link rel="stylesheet" href="/css/styles.css" />
		<script src="/js/manage.bundle.js"></script>
	</head>
	<body>
		<div id="app-root">
			<div class="container-fluid d-none" id="content">
				<div class="row">
					<main>
						<section class="container">
							<div class="d-flex justify-content-center mt-2 flex-column align-items-center">
								<h2>ニコ生ゲーム置き場（仮）</h2>
								<h2>管理ツール – コンテンツ管理</h2>
							</div>
							<div class="d-flex flex-column align-items-end mb-2">
								<div class="d-flex align-items-center justify-content-between mb-3" style="width: 35%">
									<div class="d-flex gap-2 w-100">
										<select id="searchFieldSelect" class="form-select w-auto">
											<option value="id">ID</option>
											<option value="userId">ユーザー ID</option>
											<option value="userName">ユーザー名</option>
											<option value="title">タイトル</option>
											<option value="description">説明</option>
										</select>
										<input
											id="searchFieldInput"
											type="text"
											class="form-control"
											placeholder="値を入力"
										/>
									</div>
								</div>
								<div
									id="searchStatus"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label for="status" class="me-3 w-50">状態</label>
									<select class="form-select">
										<option value="ok">オーケー</option>
										<option value="failed">失敗</option>
									</select>
								</div>
								<div class="d-flex align-items-start justify-content-between w-25 mb-3">
									<label class="me-3 w-50">特殊条件:</label>
									<div class="d-flex flex-column">
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterConditions"
												value="warning"
												id="warning"
											/>
											<label class="form-check-label" for="warning">警告あり</label>
										</div>
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterConditions"
												value="noThumbnail"
												id="noThumbnail"
											/>
											<label class="form-check-label" for="noThumbnail">サムネなし</label>
										</div>
									</div>
								</div>
								<button id="filterContent" class="btn btn-primary">フィルタ</button>
							</div>
							<table id="contentsTableList" class="table table-striped table-hover">
								<thead>
									<tr>
										<th>コンテンツID</th>
										<th>タイトル</th>
										<th>状態</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
							<nav class="d-flex justify-content-center">
								<button id="readMoreBtn" class="btn btn-secondary">もっと見る</button>
							</nav>
						</section>
					</main>
				</div>
			</div>
		</div>
		<div id="toast" aria-live="polite"></div>
		<div
			class="modal fade"
			id="detailModal"
			tabindex="-1"
			aria-labelledby="contentDetailModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-fullscreen">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="contentDetailModalLabel">コンテンツの詳細</h5>
					</div>
					<div class="modal-body">
						<div class="d-flex justify-content-end me-3" id="contentActionBtn">
							<button type="button" class="btn btn-primary me-3" id="editBtn">更新</button>
							<button type="button" class="btn btn-danger" id="deleteBtn">削除</button>
						</div>
						<div
							id="thumbnailContent"
							class="d-flex flex-column align-items-center justify-content-center m-3 d-none"
						>
							<img src="" class="img-fluid agd-thumb mb-2" alt="thumbnail" />
							<input
								id="content-thumb"
								class="form-control w-25 d-none"
								type="file"
								accept="image/png,image/jpeg,image/webp"
							/>
						</div>
						<form id="detailForm" class="w-25 mx-auto mb-3">
							<div class="mb-3">
								<label for="contentIdDetail" class="form-label">ID</label>
								<input type="text" class="form-control" name="id" id="contentIdDetail" readonly />
							</div>
							<div class="mb-3">
								<label for="title" class="form-label">タイトル</label>
								<input type="text" class="form-control" name="title" id="title" readonly />
							</div>
							<div class="mb-3">
								<label for="description" class="form-label">説明</label>
								<textarea
									class="form-control"
									name="description"
									id="description"
									rows="3"
									readonly
								></textarea>
							</div>
							<div class="mb-3">
								<label for="state" class="form-label">状態</label>
								<select class="form-select" name="state" id="state" disabled>
									<option value="ok">オーケー</option>
									<option value="failed">失敗</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="warnings" class="form-label">警告</label>
								<textarea
									class="form-control"
									name="warnings"
									id="warnings"
									rows="3"
									readonly
								></textarea>
							</div>
							<div class="mb-3">
								<label for="createdAt" class="form-label">作成日時</label>
								<input type="text" class="form-control" name="createdAt" id="createdAt" readonly />
							</div>
							<div class="mb-3">
								<label for="updatedAt" class="form-label">更新日時</label>
								<input type="text" class="form-control" name="updatedAt" id="updatedAt" readonly />
							</div>
						</form>
						<div class="my-4">
							<h3>受信フィードバック</h3>
							<table id="feedbacksTableList" class="table table-striped">
								<thead>
									<tr class="table-dark">
										<th>ID</th>
										<th>送信者ID</th>
										<th>表題</th>
										<th>ディテール</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
					</div>
				</div>
			</div>
		</div>
		<script>
			const tool = new manage.Manage();
			document.addEventListener("DOMContentLoaded", () => {
				tool.contentsPage();
			});
		</script>
	</body>
</html>
