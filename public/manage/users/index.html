<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ニコ生ゲーム置き場（仮）</title>
		<link rel="stylesheet" href="/css/styles.css" />
		<script src="/js/manage.bundle.js"></script>
	</head>
	<body>
		<div id="app-root">
			<div class="container-fluid d-none" id="usersContent">
				<div class="row">
					<main>
						<section class="container">
							<div class="d-flex justify-content-center mt-2 flex-column align-items-center">
								<h2>ニコ生ゲーム置き場（仮）</h2>
								<h2>管理ツール – ユーザー管理</h2>
							</div>
							<div class="d-flex flex-column align-items-end mb-2">
								<div
									id="searchUserId"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label for="userId" class="me-3 w-50">ID</label>
									<input type="text" class="form-control" placeholder="ユーザー ID" />
								</div>
								<div
									id="searchUserName"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label for="userId" class="me-3 w-50">ユーザー名</label>
									<input type="text" class="form-control" placeholder="ユーザー名" />
								</div>
								<button id="filterUser" class="btn btn-primary">フィルタ</button>
							</div>
							<table id="usersTableList" class="table table-striped table-hover">
								<thead>
									<tr>
										<th>ユーザー ID</th>
										<th>ユーザー名</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>
							<nav class="d-flex justify-content-center">
								<button id="readMoreBtn" class="btn btn-secondary">もっと見る</button>
							</nav>
						</section>
						<div id="detailModal" class="modal fade" tabindex="-1">
							<div class="modal-dialog modal-xl">
								<div class="modal-content">
									<form id="detailForm">
										<div class="modal-header">
											<h5 class="modal-title">詳細</h5>
											<button
												type="button"
												class="btn-close"
												data-bs-dismiss="modal"
												aria-label="Close"
											></button>
										</div>
										<div class="modal-body">
											<div class="mb-3">
												<label for="id" class="form-label">ID</label>
												<input type="text" class="form-control" name="id" readonly />
											</div>
											<div class="mb-3">
												<label for="typeString" class="form-label">種別</label>
												<input type="text" class="form-control" name="typeString" readonly />
											</div>
											<div class="mb-3">
												<label for="targetId" class="form-label">対象ID</label>
												<input type="text" class="form-control" name="targetId" readonly />
											</div>
											<div class="mb-3">
												<label for="startAt" class="form-label">開始日時</label>
												<div class="input-group">
													<input
														type="text"
														class="form-control"
														name="startAt"
														placeholder="YYYY/MM/DD HH:MM"
													/>
													<button type="button" class="btn btn-primary saveStartAtButton">
														保存
													</button>
												</div>
											</div>
											<div class="mb-3">
												<label for="endAt" class="form-label">終了日時</label>
												<div class="input-group">
													<input
														type="text"
														class="form-control"
														name="endAt"
														placeholder="YYYY/MM/DD HH:MM"
													/>
													<button type="button" class="btn btn-primary saveEndAtButton">
														保存
													</button>
												</div>
											</div>
											<div class="mb-3">
												<label for="state" class="form-label">状態</label>
												<input type="text" class="form-control" name="state" readonly />
											</div>
											<div class="mb-3">
												<label for="createdAt" class="form-label">作成日時</label>
												<input type="text" class="form-control" name="createdAt" readonly />
											</div>
											<div class="mb-3">
												<label for="updatedAt" class="form-label">更新日時</label>
												<input type="text" class="form-control" name="updatedAt" readonly />
											</div>
											<div class="d-flex justify-content-between mt-3">
												<span>制限</span>
											</div>
											<table id="restrictionsTableList" class="table table-striped">
												<thead>
													<tr>
														<th>種別</th>
														<th>パラメータ</th>
													</tr>
												</thead>
												<tbody></tbody>
											</table>
											<div class="d-flex justify-content-between mt-2">
												<span>報酬</span>
											</div>
											<table id="rewardsTableList" class="table table-striped">
												<thead>
													<tr>
														<th>種別</th>
														<th>パラメータ1</th>
														<th>パラメータ2</th>
														<th>条件</th>
													</tr>
												</thead>
												<tbody></tbody>
											</table>
										</div>
										<div class="modal-footer">
											<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
												閉じる
											</button>
										</div>
									</form>
								</div>
							</div>
						</div>
					</main>
				</div>
			</div>
		</div>
		<div id="toast" aria-live="polite"></div>
		<script>
			const tool = new manage.Manage();
			document.addEventListener("DOMContentLoaded", () => {
				tool.usersPage();
			});
		</script>
	</body>
</html>
