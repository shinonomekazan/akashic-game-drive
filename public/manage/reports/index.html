<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ニコ生ゲーム置き場（仮）</title>
		<link rel="stylesheet" href="/css/styles.css" />
		<script src="/js/manage.bundle.js"></script>
	</head>
	<body>
		<div id="app-root">
			<div class="container-fluid d-none" id="reportsContent">
				<div class="row">
					<main>
						<section class="container">
							<div class="d-flex justify-content-center mt-2 flex-column align-items-center">
								<h2>ニコ生ゲーム置き場（仮）</h2>
								<h2>管理ツール – レポート管理</h2>
							</div>
							<div class="d-flex flex-column align-items-end mb-2">
								<div
									id="searchReportId"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label class="me-3 w-50">ID</label>
									<input type="text" class="form-control" placeholder="レポート ID" />
								</div>
								<div
									id="searchReporterId"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label class="me-3 w-50">Reporter ID</label>
									<input type="text" class="form-control" placeholder="Reporter ID" />
								</div>
								<div
									id="searchReportContentId"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label class="me-3 w-50">Content ID</label>
									<input type="text" class="form-control" placeholder="Content ID" />
								</div>
								<div class="d-flex align-items-start justify-content-between w-25 mb-3">
									<label class="me-3 w-50">Category</label>
									<div class="d-flex flex-row gap-3">
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterCategory"
												value="spam"
												id="categorySpam"
											/>
											<label class="form-check-label" for="categorySpam">spam</label>
										</div>
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterCategory"
												value="violation"
												id="categoryViolation"
											/>
											<label class="form-check-label" for="categoryViolation">violation</label>
										</div>
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterCategory"
												value="other"
												id="categoryOther"
											/>
											<label class="form-check-label" for="categoryOther">other</label>
										</div>
									</div>
								</div>
								<div
									id="searchReportDescription"
									class="d-flex align-items-center justify-content-between w-25 mb-3"
								>
									<label class="me-3 w-50">Description</label>
									<input type="text" class="form-control" placeholder="Description" />
								</div>
								<div class="d-flex align-items-start justify-content-between w-25 mb-3">
									<label class="me-3 w-50">Status</label>
									<div class="d-flex flex-row gap-3">
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterStatus"
												value="waiting"
												id="statusWaiting"
											/>
											<label class="form-check-label" for="statusWaiting">waiting</label>
										</div>
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterStatus"
												value="rejected"
												id="statusRejected"
											/>
											<label class="form-check-label" for="statusRejected">rejected</label>
										</div>
										<div class="form-check">
											<input
												class="form-check-input"
												type="checkbox"
												name="filterStatus"
												value="resolved"
												id="statusResolved"
											/>
											<label class="form-check-label" for="statusResolved">resolved</label>
										</div>
									</div>
								</div>

								<button id="filterReport" class="btn btn-primary">フィルタ</button>
							</div>
							<table id="reportsTableList" class="table table-striped table-hover">
								<thead>
									<tr>
										<th>ID</th>
										<th>Reporter ID</th>
										<th>Content ID</th>
										<th>Category</th>
										<th>Status</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody></tbody>
							</table>

							<nav class="d-flex justify-content-center">
								<button id="readMoreReportBtn" class="btn btn-secondary">もっと見る</button>
							</nav>
						</section>
					</main>
				</div>
			</div>
		</div>

		<div id="toast" aria-live="polite"></div>
		<div
			class="modal fade"
			id="detailModal"
			tabindex="-1"
			aria-labelledby="reportDetailModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-fullscreen">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="reportDetailModalLabel">レポート詳細</h5>
					</div>
					<div class="modal-body">
						<div class="d-flex justify-content-end me-3" id="reportActionBtn">
							<button type="button" class="btn btn-primary me-3" id="editBtn">更新</button>
							<button type="button" class="btn btn-danger" id="deleteBtn">削除</button>
						</div>

						<form id="detailForm" class="w-25 mx-auto mb-3">
							<div class="mb-3">
								<label for="reportId" class="form-label">ID</label>
								<input type="text" class="form-control" name="id" id="reportId" readonly />
							</div>
							<div class="mb-3">
								<label for="reportReporterId" class="form-label">Reporter ID</label>
								<input
									type="text"
									class="form-control"
									name="reporterId"
									id="reportReporterId"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportContentId" class="form-label">Content ID</label>
								<input
									type="text"
									class="form-control"
									name="contentId"
									id="reportContentId"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportCategory" class="form-label">Category</label>
								<input type="text" class="form-control" name="category" id="reportCategory" readonly />
							</div>
							<div class="mb-3">
								<label for="reportDescription" class="form-label">Description</label>
								<textarea
									class="form-control"
									name="description"
									id="reportDescription"
									rows="3"
									readonly
								></textarea>
							</div>
							<div class="mb-3">
								<label for="reportStatus" class="form-label">Status</label>
								<select class="form-select" name="status" id="reportStatus">
									<option value="waiting">waiting</option>
									<option value="rejected">rejected</option>
									<option value="resolved">resolved</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="reportCreatedAt" class="form-label">作成日時</label>
								<input
									type="text"
									class="form-control"
									name="createdAt"
									id="reportCreatedAt"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportUpdatedAt" class="form-label">更新日時</label>
								<input
									type="text"
									class="form-control"
									name="updatedAt"
									id="reportUpdatedAt"
									readonly
								/>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-fullscreen">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="editModalLabel">レポート編集</h5>
					</div>
					<div class="modal-body">
						<form id="editForm" class="w-25 mx-auto mb-3">
							<div class="d-flex justify-content-end me-3">
								<button type="submit" class="btn btn-primary me-3">更新</button>
							</div>
							<div class="mb-3">
								<label for="reportId" class="form-label">ID</label>
								<input type="text" class="form-control" name="id" id="reportId" readonly />
							</div>
							<div class="mb-3">
								<label for="reportReporterId" class="form-label">Reporter ID</label>
								<input
									type="text"
									class="form-control"
									name="reporterId"
									id="reportReporterId"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportContentId" class="form-label">Content ID</label>
								<input
									type="text"
									class="form-control"
									name="contentId"
									id="reportContentId"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportCategory" class="form-label">Category</label>
								<input type="text" class="form-control" name="category" id="reportCategory" readonly />
							</div>
							<div class="mb-3">
								<label for="reportDescription" class="form-label">Description</label>
								<textarea
									class="form-control"
									name="description"
									id="reportDescription"
									rows="3"
									readonly
								></textarea>
							</div>
							<div class="mb-3">
								<label for="reportStatus" class="form-label">Status</label>
								<select class="form-select" name="status" id="reportStatus">
									<option value="waiting">waiting</option>
									<option value="rejected">rejected</option>
									<option value="resolved">resolved</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="reportCreatedAt" class="form-label">作成日時</label>
								<input
									type="text"
									class="form-control"
									name="createdAt"
									id="reportCreatedAt"
									readonly
								/>
							</div>
							<div class="mb-3">
								<label for="reportUpdatedAt" class="form-label">更新日時</label>
								<input
									type="text"
									class="form-control"
									name="updatedAt"
									id="reportUpdatedAt"
									readonly
								/>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="deleteModalLabel">削除</h5>
					</div>
					<div class="modal-body">
						<form id="deleteForm" class="mb-3">
							<div class="d-flex justify-content-end me-3">
								<button type="submit" class="btn btn-danger">削除</button>
							</div>
							<div class="mb-3">
								<label for="reportId" class="form-label">ID</label>
								<input type="text" class="form-control" name="id" id="reportId" readonly />
							</div>
							<div class="alert alert-danger" role="alert">
								このデータを削除します。本当によろしいですか？
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
					</div>
				</div>
			</div>
		</div>

		<script>
			const tool = new manage.Manage();
			document.addEventListener("DOMContentLoaded", () => {
				tool.reportsPage();
			});
		</script>
	</body>
</html>
